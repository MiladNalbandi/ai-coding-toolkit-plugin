<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="820" fill="#f4f7fb"/>
  <g fill="#131b26">
    <text x="60" y="66" font-size="30" font-weight="600">The AC loop</text>
    <text x="60" y="96" font-size="17" fill="#41536b">One acceptance criterion at a time — two commits and a gate before the next one.</text>
  </g>

  <!-- input -->
  <rect x="60" y="132" width="300" height="44" rx="3" fill="#e7edf6" stroke="#c3d1e3"/>
  <text x="80" y="160" font-size="15" fill="#41536b" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ACs from clarify-loop / spec</text>
  <path d="M210 176 L210 208" stroke="#8fa3bd" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8fa3bd"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1f5f9e"/>
    </marker>
  </defs>

  <!-- loop container -->
  <rect x="60" y="208" width="1080" height="368" rx="4" fill="none" stroke="#c3d1e3" stroke-dasharray="6 5"/>
  <rect x="84" y="196" width="248" height="26" rx="2" fill="#f4f7fb"/>
  <text x="92" y="215" font-size="13" fill="#6d809a" font-family="ui-monospace, Menlo, monospace" letter-spacing="1.2">FOR EACH AC-NNN, IN ORDER</text>

  <!-- RED -->
  <rect x="104" y="256" width="290" height="176" rx="4" fill="#ffffff" stroke="#9a3436" stroke-width="1.5"/>
  <rect x="104" y="256" width="290" height="34" rx="4" fill="#f7dedd"/>
  <rect x="104" y="282" width="290" height="8" fill="#f7dedd"/>
  <text x="122" y="279" font-size="14" font-weight="600" fill="#9a3436" letter-spacing="1.4">RED</text>
  <g font-size="14.5" fill="#41536b">
    <text x="122" y="318">write the test for this AC only</text>
    <text x="122" y="342">run → it must fail on the assertion</text>
  </g>
  <rect x="122" y="360" width="254" height="30" rx="3" fill="#f2f5f9" stroke="#d6dfeb"/>
  <text x="134" y="380" font-size="13" fill="#131b26" font-family="ui-monospace, Menlo, monospace">test(AC-003): empty title</text>
  <text x="122" y="412" font-size="13" fill="#6d809a">commit #1 — tests only</text>

  <path d="M394 344 L446 344" stroke="#1f5f9e" stroke-width="2" marker-end="url(#b)"/>

  <!-- GREEN -->
  <rect x="456" y="256" width="290" height="176" rx="4" fill="#ffffff" stroke="#1f6b4f" stroke-width="1.5"/>
  <rect x="456" y="256" width="290" height="34" rx="4" fill="#d9ece3"/>
  <rect x="456" y="282" width="290" height="8" fill="#d9ece3"/>
  <text x="474" y="279" font-size="14" font-weight="600" fill="#1f6b4f" letter-spacing="1.4">GREEN</text>
  <g font-size="14.5" fill="#41536b">
    <text x="474" y="318">minimum code that passes — YAGNI</text>
    <text x="474" y="342">this AC green, no other AC broken</text>
  </g>
  <rect x="474" y="360" width="254" height="30" rx="3" fill="#f2f5f9" stroke="#d6dfeb"/>
  <text x="486" y="380" font-size="13" fill="#131b26" font-family="ui-monospace, Menlo, monospace">feat(AC-003): empty title</text>
  <text x="474" y="412" font-size="13" fill="#6d809a">commit #2 — implementation only</text>

  <path d="M746 344 L798 344" stroke="#1f5f9e" stroke-width="2" marker-end="url(#b)"/>

  <!-- GATE -->
  <rect x="808" y="256" width="290" height="176" rx="4" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
  <rect x="808" y="256" width="290" height="34" rx="4" fill="#dbe8f7"/>
  <rect x="808" y="282" width="290" height="8" fill="#dbe8f7"/>
  <text x="826" y="279" font-size="14" font-weight="600" fill="#1f5f9e" letter-spacing="1.4">GATE</text>
  <g font-size="13.5" fill="#41536b">
    <text x="826" y="316">you decide, one criterion in:</text>
    <text x="826" y="338">approve · human review · AI review</text>
    <text x="826" y="358">recommend, then re-review</text>
    <text x="826" y="378">refactor · reject back to red</text>
  </g>
  <rect x="826" y="392" width="254" height="28" rx="3" fill="#f2f5f9" stroke="#d6dfeb"/>
  <text x="838" y="411" font-size="13" fill="#131b26" font-family="ui-monospace, Menlo, monospace">AC-003 ▶ 2/9 done</text>

  <!-- return path -->
  <path d="M953 432 L953 500 L249 500 L249 432" stroke="#8fa3bd" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="520" y="486" width="160" height="28" rx="2" fill="#f4f7fb"/>
  <text x="536" y="506" font-size="14" fill="#41536b">next AC · or retry</text>

  <!-- exit -->
  <path d="M600 576 L600 612" stroke="#8fa3bd" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="330" y="618" width="540" height="44" rx="3" fill="#e7edf6" stroke="#c3d1e3"/>
  <text x="352" y="646" font-size="15" fill="#41536b">all ACs green → whole-feature refactor → review + smoke → ADR</text>
</svg>
